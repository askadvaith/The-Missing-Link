      #   input_keys: ["input"]
      #   answer_key: "target"
      #   metric_type: "mcq_generative"
      - benchmark_name: "MMLU-Pro Logical Reasoning"
        hf_repo: "TIGER-Lab/MMLU-Pro"
        split: "test"
        input_keys: ["question"]
        choice_keys: ["options"]
        answer_key: "answer"
        metric_type: "mcq_generative"
