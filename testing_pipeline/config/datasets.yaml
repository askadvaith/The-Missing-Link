# Map predicted tasks to HuggingFace benchmarks with metric types
#
# Evaluation uses log-probability scoring:
#   - mcq_generative      → first-token logprob ranking (1 token per sample)
#   - exact_numeric        → generate + extract number
#   - token_f1             → generate + SQuAD-style token F1
#   - classification       → generate + extract numeric label
#
# Benchmarks marked `enabled: false` are kept for reference but skipped at runtime.

datasets:
  "Logical Reasoning":
