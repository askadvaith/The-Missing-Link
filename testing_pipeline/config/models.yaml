# Define default models and fallback aliases

defaults:
  synthesizer: "gpt-oss:120b-cloud"      # Model to synthesize new prompts from components
  evaluator: "llama3.1:8b"   # Model tested against benchmarks (log-prob scoring)

# Define configurations for aliases (useful if overriding API bases / parameters)
model_aliases:
  gpt-oss:120b-cloud:
    provider: openai_compatible
    model: ollama/gpt-oss:120b-cloud
    base_url: http://localhost:11434
    temperature: 0
    seed: 42

  llama3.1:8b:
    provider: "openai_compatible"
    model: "llama3.1:8b"
    base_url: "http://localhost:11434"
    temperature: 0
    seed: 42

  llama3.1:8b_local:
    provider: "openai_compatible"
    model: "llama3.1:8b_local"
    base_url: "http://localhost:11434"
    temperature: 0
    seed: 42

  gemma4:e4b:
    provider: "openai_compatible"
    model: "gemma4:e4b"
    base_url: "http://localhost:11434"
    temperature: 0
    think: false
    seed: 42

  granite4.1:8b:
    provider: "openai_compatible"
    model: "granite4.1:8b"
    base_url: "http://localhost:11434"
    temperature: 0
    seed: 42

  llama3.1:8b_remote:
    provider: openai_compatible
    model: llama3.1:8b
    base_url: https://certainty-handclap-occupancy.ngrok-free.dev/
    api_key_env: OLLAMA_API_KEY
    temperature: 0
    seed: 42

  qwen3.5:27b_remote:
    provider: openai_compatible
    model: qwen3.5:27b
    base_url: https://certainty-handclap-occupancy.ngrok-free.dev/
    api_key_env: OLLAMA_API_KEY
    temperature: 0
    seed: 42
    think: false

  gpt-oss:20b_remote:
    provider: openai_compatible
    model: gpt-oss:20b
    base_url: https://jess-transmittible-tastily.ngrok-free.dev
    api_key_env: OLLAMA_API_KEY
    temperature: 0
    seed: 42
    think: false 
    max_tokens: 8192


